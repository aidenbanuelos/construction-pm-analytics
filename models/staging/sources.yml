version: 2

sources:
  - name: construction
    database: resolute-world-504820-r0
    schema: construction
    tables:
      - name: tasks
      - name: forms

models:
  - name: stg_tasks
    description: >
      Cleaned, type-cast version of raw construction.tasks. Splits the
      overloaded Priority column into priority_level, safety_incident_classification,
      and lookahead_tag. Converts Target from Excel serial date to a real date.
      NOTE: task_ref is NOT globally unique — it repeats across different
      projects (306 duplicates found). The true composite key is
      task_ref + project_id together.
    columns:
      - name: task_ref
        description: >
          Task reference. Only unique within a single project — the same
          Ref value can appear in multiple projects. Do not test this
          column alone for uniqueness.
        tests:
          - not_null
      - name: project_id
        description: >
          Project this task belongs to. Combined with task_ref, forms
          the true composite key.
        tests:
          - not_null
      - name: created_date
        tests:
          - not_null
      - name: report_status
        tests:
          - not_null
